[package]
name = "unshackled-bot"
version = "0.1.0"
description = "Unshackled Bot desktop app"
authors = ["Unshackled"]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "unshackled_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deny the patterns that turn into runtime panics in a shipped desktop app.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "deny"
dbg_macro = "deny"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
