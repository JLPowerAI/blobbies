[package]
name = "blobbies"
version = "0.1.0"
description = "Blobbies desktop app"
authors = ["Blobbies"]
edition = "2024"
# Matches the toolchain pinned in rust-toolchain.toml. Kept in sync deliberately: a
# lower value makes cargo's MSRV-aware resolver hold back security patches.
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "blobbies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Capital-B binary so the dev dock name matches the product name.
name = "Blobbies"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tauri-plugin-http = "2.5.9"
# OS notifications for runs that finish or need the user while the app is
# in the background.
tauri-plugin-notification = "2.3.3"
# OS-native secret storage (macOS Keychain / Windows Credential Store /
# Linux Secret Service) for the Tinfoil API key — never plaintext JSON.
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deny the patterns that turn into runtime panics in a shipped desktop app.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "deny"
dbg_macro = "deny"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
