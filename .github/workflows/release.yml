name: Release build

# Produces the per-OS installers the README promises ("Installers are on the
# way"). Runs on a `v*` tag or by hand; artifacts land on the workflow run
# under Actions → Release build → artifacts, from where they can be attached
# to a GitHub Release.
#
# Deliberately unsigned for now: no macOS notarization, no Windows
# certificate. macOS users get Gatekeeper's right-click → Open flow and
# Windows shows SmartScreen — expected at this stage, and the reason these are
# workflow artifacts rather than a published release.
#
# simplification: macOS builds arm64 only. Intel Macs need
# `rustup target add x86_64-apple-darwin` and `--target universal-apple-darwin`
# (2.5x build time); revisit when there is evidence an Intel user exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64: Blobbies.dmg
            bundles: dmg
          - os: ubuntu-latest # x64: .deb + .AppImage
            bundles: deb,appimage
          - os: windows-latest # x64: NSIS setup .exe
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Linux webkit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2t64: AppImage tooling (linuxdeploy) needs FUSE 2, which
          # ubuntu-24.04 dropped; renamed from libfuse2 there.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64

      # Installs the exact toolchain + components pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # bash on every OS so the comma list and forward slashes behave the same.
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: blobbies-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
